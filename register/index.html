:root {

  --on-gold: #111111;
  --f-latin: 'Poppins', 'Segoe UI', system-ui, sans-serif;
  --f-ar: 'Noto Kufi Arabic', 'Segoe UI', Tahoma, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #14130F; --surface: #1E1C17; --sand: #2A2720; --ink: #F4F1E6; --muted: #B8B29E; --line: #4A4637;
    --gold: #D2B356; --gold-text: #E2C673; --blue: #6DB4E0; --danger: #FF8A80; --ok: #6FD3A0; --field: #17160F; --on-gold: #111111;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #14130F; --surface: #1E1C17; --sand: #2A2720; --ink: #F4F1E6; --muted: #B8B29E; --line: #4A4637;
  --gold: #D2B356; --gold-text: #E2C673; --blue: #6DB4E0; --danger: #FF8A80; --ok: #6FD3A0; --field: #17160F; --on-gold: #111111;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--f-latin); font-size: 15px; line-height: 1.6; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 20px 48px; }
#app { max-width: 680px; margin: 0 auto; }
#app[lang="ar"] { font-family: var(--f-ar); line-height: 1.85; }
#app[lang="ar"] h1, #app[lang="ar"] h2, #app[lang="ar"] .eyebrow, #app[lang="ar"] button { letter-spacing: 0; }

.top { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-bottom: 18px; }
.eyebrow { font-size: 12px; font-weight: 600; letter-spacing: .12em; text-transform: uppercase; color: var(--gold-text); }
#app[lang="ar"] .eyebrow { text-transform: none; }
.lang { font: inherit; font-size: 13px; font-weight: 600; background: transparent; color: var(--ink); border: 1px solid var(--line); border-radius: 999px; padding: 6px 14px; cursor: pointer; }
.lang:hover { border-color: var(--gold); }
h1 { font-size: 30px; line-height: 1.2; margin: 6px 0 8px; font-weight: 700; text-wrap: balance; }
.sub { color: var(--muted); margin: 0 0 14px; max-width: 60ch; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; margin: 0 0 22px; padding: 0; list-style: none; }
.chips li { background: var(--sand); border: 1px solid var(--line); border-radius: 999px; padding: 3px 12px; font-size: 13px; font-weight: 500; }

form, .card { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 22px 20px; }
fieldset { border: 0; margin: 0 0 26px; padding: 0; min-width: 0; }
legend { font-size: 13px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--gold-text); padding: 0; margin-bottom: 12px; }
#app[lang="ar"] legend { text-transform: none; letter-spacing: 0; font-size: 14px; }
.field { display: grid; gap: 6px; margin-bottom: 16px; min-width: 0; }
.field > label, .field > .lbl { font-weight: 600; font-size: 14px; }
.opt { font-weight: 400; color: var(--muted); font-size: 13px; }
.hint { color: var(--muted); font-size: 13px; margin: 0; }
input[type=text], input[type=tel], input[type=email], select, textarea {
  font: inherit; color: var(--ink); background: var(--field); border: 1px solid var(--line); border-radius: 10px; padding: 11px 12px; width: 100%; min-width: 0;
}
textarea { min-height: 92px; resize: vertical; }
input:focus-visible, select:focus-visible, textarea:focus-visible, button:focus-visible, .choice input:focus-visible { outline: 3px solid var(--blue); outline-offset: 2px; }
.choices { display: grid; gap: 8px; }
.choice { display: flex; gap: 10px; align-items: flex-start; padding: 10px 12px; border: 1px solid var(--line); border-radius: 10px; background: var(--field); cursor: pointer; }
.choice input { margin-top: 5px; accent-color: var(--gold-text); flex: none; }
.choice:has(input:checked) { border-color: var(--gold); background: var(--sand); }
.err { color: var(--danger); font-size: 13px; margin: 0; min-height: 0; }
.invalid input[type=text], .invalid input[type=tel], .invalid input[type=email], .invalid select, .invalid textarea, .invalid .choices { border-color: var(--danger); }
.btn { font: inherit; font-weight: 700; font-size: 15px; background: var(--gold); color: var(--on-gold); border: 0; border-radius: 10px; padding: 13px 22px; cursor: pointer; }
.btn:hover { filter: brightness(1.06); }
.btn.ghost { background: transparent; color: var(--ink); border: 1px solid var(--line); font-weight: 600; }
.btn[disabled] { opacity: .6; cursor: progress; }
.row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.note { font-size: 13px; color: var(--muted); }

.done h2 { font-size: 22px; margin: 0 0 6px; }
.status { display: inline-block; font-size: 13px; font-weight: 600; border-radius: 999px; padding: 3px 12px; margin-bottom: 12px; }
.status.ok { background: color-mix(in srgb, var(--ok) 16%, transparent); color: var(--ok); }
.status.todo { background: var(--sand); color: var(--gold-text); border: 1px solid var(--line); }
.msg { width: 100%; min-height: 220px; font-family: var(--f-latin); font-size: 14px; line-height: 1.6; direction: inherit; }
#app[lang="ar"] .msg { font-family: var(--f-ar); }

.owner { margin-top: 28px; }
.owner h2 { font-size: 18px; margin: 0 0 4px; }
.tablewrap { overflow-x: auto; border: 1px solid var(--line); border-radius: 10px; margin: 12px 0; }
table { border-collapse: collapse; width: 100%; font-size: 13px; }
th, td { padding: 8px 10px; border-bottom: 1px solid var(--line); text-align: start; white-space: nowrap; }
th { background: var(--sand); font-weight: 600; }
tr:last-child td { border-bottom: 0; }
.seats { font-variant-numeric: tabular-nums; font-weight: 700; }

@media (prefers-reduced-motion: no-preference) { .choice, .btn, .lang { transition: border-color .15s, background-color .15s, filter .15s; } }

html{color-scheme:light}

<main id="app" lang="ar" dir="rtl">
  <div class="top">
    <span class="eyebrow" data-i18n="eyebrow"></span>
    <button type="button" class="lang" id="langBtn"></button>
  </div>
  <h1 data-i18n="title"></h1>
  <p class="sub" data-i18n="sub"></p>
  <ul class="chips" id="chips"></ul>

  <section id="formView">
    <form id="regForm" novalidate>
      <fieldset>
        <legend data-i18n="secAbout"></legend>
        <div class="field" data-f="name">
          <label for="name" data-i18n="name"></label>
          <input type="text" id="name" autocomplete="name" maxlength="80">
          <p class="err" data-err></p>
        </div>
        <div class="field" data-f="whatsapp">
          <label for="whatsapp" data-i18n="whatsapp"></label>
          <input type="tel" id="whatsapp" inputmode="tel" autocomplete="tel" maxlength="24" dir="ltr" placeholder="+964 7XX XXX XXXX">
          <p class="err" data-err></p>
        </div>
        <div class="field" data-f="email">
          <label for="email"><span data-i18n="email"></span> <span class="opt" data-i18n="optional"></span></label>
          <input type="email" id="email" autocomplete="email" maxlength="120" dir="ltr">
          <p class="err" data-err></p>
        </div>
        <div class="field" data-f="role">
          <label for="role" data-i18n="role"></label>
          <select id="role"></select>
          <p class="err" data-err></p>
        </div>
        <div class="field" data-f="org">
          <label for="org"><span data-i18n="org"></span> <span class="opt" data-i18n="optional"></span></label>
          <input type="text" id="org" maxlength="100">
        </div>
        <div class="field" data-f="area">
          <label for="area" data-i18n="area"></label>
          <input type="text" id="area" maxlength="100" autocomplete="address-level2">
          <p class="hint" data-i18n="areaHint"></p>
          <p class="err" data-err></p>
        </div>
      </fieldset>

      <fieldset>
        <legend data-i18n="secExp"></legend>
        <div class="field" data-f="level">
          <span class="lbl" data-i18n="level"></span>
          <div class="choices" id="levelChoices" role="radiogroup"></div>
          <p class="err" data-err></p>
        </div>
        <div class="field" data-f="tools">
          <span class="lbl" data-i18n="tools"></span>
          <div class="choices" id="toolsChoices"></div>
          <p class="err" data-err></p>
        </div>
        <div class="field" data-f="why">
          <label for="why" data-i18n="why"></label>
          <textarea id="why" maxlength="600"></textarea>
          <p class="err" data-err></p>
        </div>
        <div class="field" data-f="problem">
          <label for="problem"><span data-i18n="problem"></span> <span class="opt" data-i18n="optional"></span></label>
          <textarea id="problem" maxlength="600"></textarea>
          <p class="hint" data-i18n="problemHint"></p>
        </div>
        <div class="field" data-f="pitch">
          <span class="lbl" data-i18n="pitch"></span>
          <div class="choices" id="pitchChoices" role="radiogroup"></div>
          <p class="err" data-err></p>
        </div>
      </fieldset>

      <fieldset>
        <legend data-i18n="secWhen"></legend>
        <div class="field" data-f="days">
          <span class="lbl" data-i18n="days"></span>
          <div class="choices" id="daysChoices" role="radiogroup"></div>
          <p class="err" data-err></p>
        </div>
        <div class="field" data-f="hours">
          <span class="lbl" data-i18n="hours"></span>
          <div class="choices" id="hoursChoices"></div>
          <p class="hint" data-i18n="hoursHint"></p>
          <p class="err" data-err></p>
        </div>
      </fieldset>

      <fieldset>
        <legend data-i18n="secCommit"></legend>
        <div class="field" data-f="attend">
          <span class="lbl" data-i18n="attend"></span>
          <div class="choices" id="attendChoices" role="radiogroup"></div>
          <p class="err" data-err></p>
        </div>
        <div class="field" data-f="commit">
          <span class="lbl" data-i18n="commitLbl"></span>
          <div class="choices" id="commitChoices"></div>
          <p class="err" data-err></p>
        </div>
        <div class="field" data-f="consent">
          <div class="choices"><label class="choice"><input type="checkbox" id="consent"><span data-i18n="consent"></span></label></div>
          <p class="err" data-err></p>
        </div>
      </fieldset>

      <div class="hp" aria-hidden="true"><label>Website <input type="text" id="website" name="website" tabindex="-1" autocomplete="off"></label></div>
      <div class="row">
        <button type="submit" class="btn" id="submitBtn" data-i18n="submit"></button>
        <span class="note" id="submitNote"></span>
      </div>
    </form>
  </section>

    <section id="doneView" class="card done" hidden>
    <span class="status ok" id="doneStatus"></span>
    <h2 id="doneTitle"></h2>
    <p class="sub" id="doneText"></p>
    <div class="row"><button type="button" class="btn ghost" id="editBtn"></button></div>
  </section>
</main>

var app = $("app");
function t(k) { return S[lang][k]; }

S.ar.okText = "سجّلنا طلبك. سنتواصل معك على واتساب بعد اختيار المجموعة الأولى."; S.en.okText = "We recorded your application. We will contact you on WhatsApp once the first group is chosen.";
S.ar.okUpdated = "حدّثنا طلبك بالبيانات الجديدة."; S.en.okUpdated = "We updated your application with the new details.";
S.ar.received = "تم الاستلام"; S.en.received = "Received";
S.ar.errSend = "تعذّر الإرسال. حاول مرة أخرى بعد قليل."; S.en.errSend = "Could not send. Please try again shortly.";
S.ar.errMany = "محاولات كثيرة. حاول لاحقاً."; S.en.errMany = "Too many attempts. Please try later.";

function buildChoices(boxId, name, labels, type) {
  var box = $(boxId); box.innerHTML = "";
  labels.forEach(function (l, i) {
    var lab = document.createElement("label"); lab.className = "choice";
    var inp = document.createElement("input"); inp.type = type; inp.name = name; inp.value = String(i);
    var sp = document.createElement("span"); sp.setAttribute("data-lbl", name + i);
    lab.appendChild(inp); lab.appendChild(sp); box.appendChild(lab);
  });
}
function fillLabels() {
  var map = { level: "levels", pitch: "pitches", attend: "attends", commit: "commit", tools: "toolList", days: "dayOpts", hours: "hourOpts" };
  Object.keys(map).forEach(function (n) {
    S[lang][map[n]].forEach(function (txt, i) { var el = document.querySelector('[data-lbl="' + n + i + '"]'); if (el) el.textContent = txt; });
  });
}
function fillRole() {
  var sel = $("role"), cur = sel.value; sel.innerHTML = "";
  var o = document.createElement("option"); o.value = ""; o.textContent = t("pick"); sel.appendChild(o);
  t("fields").forEach(function (f, i) { if (i === 5) return; /* Student option hidden; index kept so saved values stay the same */ var op = document.createElement("option"); op.value = String(i); op.textContent = f; sel.appendChild(op); });
  sel.value = cur;
}
function renderDone(updated) {
  $("formView").hidden = true; $("doneView").hidden = false;
  $("doneStatus").textContent = t("received");
  $("doneTitle").textContent = t("doneTitle");
  $("doneText").textContent = updated ? t("okUpdated") : t("okText");
  $("editBtn").textContent = t("edit");
}
var lastUpdated = false;
function applyLang() {
  app.lang = lang; app.dir = lang === "ar" ? "rtl" : "ltr";
  document.querySelectorAll("[data-i18n]").forEach(function (el) { var v = t(el.getAttribute("data-i18n")); if (typeof v === "string") el.textContent = v; });
  $("chips").innerHTML = ""; t("chips").forEach(function (c) { var li = document.createElement("li"); li.textContent = c; $("chips").appendChild(li); });
  $("langBtn").textContent = t("langBtn");
  fillLabels(); fillRole();
  if (!$("doneView").hidden) renderDone(lastUpdated);
  document.querySelectorAll(".field.invalid").forEach(function (f) { f.classList.remove("invalid"); var e = f.querySelector("[data-err]"); if (e) e.textContent = ""; });
}
function checkedIdx(name) { return Array.prototype.map.call(document.querySelectorAll('input[name="' + name + '"]:checked'), function (i) { return Number(i.value); }); }
function radioVal(name) { var r = document.querySelector('input[name="' + name + '"]:checked'); return r ? Number(r.value) : null; }
function readForm() {
  return {
    name: $("name").value.trim(), whatsapp: $("whatsapp").value.trim(), email: $("email").value.trim(),
    role: $("role").value === "" ? null : Number($("role").value), org: $("org").value.trim(), area: $("area").value.trim(),
    tools: checkedIdx("tools"), days: radioVal("days"), hours: checkedIdx("hours"),
    level: radioVal("level"), why: $("why").value.trim(), problem: $("problem").value.trim(),
    pitch: radioVal("pitch"), attend: radioVal("attend"),
    commit: document.querySelectorAll('input[name="commit"]:checked').length === 4, consent: $("consent").checked
  };
}
function validate(r) {
  var errs = {};
  if (r.name.length < 2) errs.name = 1;
  if (r.whatsapp.replace(/\D/g, "").length < 8) errs.whatsapp = 1;
  if (r.email && !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(r.email)) errs.email = 1;
  if (r.role == null) errs.role = 1;
  if (r.area.length < 2) errs.area = 1;
  if (!r.tools.length) errs.tools = 1;
  if (r.days == null) errs.days = 1;
  if (!r.hours.length) errs.hours = 1;
  if (r.level == null) errs.level = 1;
  if (r.why.length < 3) errs.why = 1;
  if (r.pitch == null) errs.pitch = 1;
  if (r.attend == null) errs.attend = 1;
  if (!r.commit) errs.commit = 1;
  if (!r.consent) errs.consent = 1;
  return errs;
}
function showErrors(errs) {
  document.querySelectorAll(".field[data-f]").forEach(function (f) {
    var k = f.getAttribute("data-f"), e = f.querySelector("[data-err]");
    if (errs[k]) { f.classList.add("invalid"); if (e) e.textContent = S[lang].e[k]; } else { f.classList.remove("invalid"); if (e) e.textContent = ""; }
  });
  var first = Object.keys(errs)[0];
  if (first) { var el = document.querySelector('.field[data-f="' + first + '"]'); var focusable = el && el.querySelector("input,select,textarea"); if (focusable) focusable.focus(); }
}
$("regForm").addEventListener("submit", function (ev) {
  ev.preventDefault();
  var r = readForm(), errs = validate(r);
  showErrors(errs);
  $("submitNote").textContent = Object.keys(errs).length ? t("errTop") : "";
  if (Object.keys(errs).length) return;
  var btn = $("submitBtn"); btn.disabled = true; btn.textContent = t("sending");
  var body = Object.assign({}, r, { lang: lang, website: $("website").value });
  fetch(SUPABASE_URL + "/rest/v1/rpc/register", { method: "POST", headers: { "Content-Type": "application/json", "apikey": SUPABASE_KEY }, body: JSON.stringify({ d: body }) })
    .then(function (res) { return res.json().catch(function () { return {}; }).then(function (j) { return { status: j && j.error === "too_many" ? 429 : (j && j.error === "invalid" ? 400 : (res.ok ? 200 : res.status)), j: j }; }); })
    .then(function (x) {
      btn.disabled = false; btn.textContent = t("submit");
      if (x.j && x.j.ok) { lastUpdated = !!x.j.updated; renderDone(lastUpdated); window.scrollTo(0, 0); }
      else if (x.status === 429) { $("submitNote").textContent = t("errMany"); }
      else if (x.status === 400 && x.j && x.j.fields) { $("submitNote").textContent = t("errTop"); }
      else { $("submitNote").textContent = t("errSend"); }
    })
    .catch(function () { btn.disabled = false; btn.textContent = t("submit"); $("submitNote").textContent = t("errSend"); });
});
$("editBtn").addEventListener("click", function () { $("doneView").hidden = true; $("formView").hidden = false; window.scrollTo(0, 0); });
$("langBtn").addEventListener("click", function () { lang = lang === "ar" ? "en" : "ar"; applyLang(); });

buildChoices("levelChoices", "level", S.ar.levels, "radio");
buildChoices("pitchChoices", "pitch", S.ar.pitches, "radio");
buildChoices("attendChoices", "attend", S.ar.attends, "radio");
buildChoices("commitChoices", "commit", S.ar.commit, "checkbox");
buildChoices("toolsChoices", "tools", S.ar.toolList, "checkbox");
buildChoices("daysChoices", "days", S.ar.dayOpts, "radio");
buildChoices("hoursChoices", "hours", S.ar.hourOpts, "checkbox");
applyLang();
</script></body></html>
